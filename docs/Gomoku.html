<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Gomoku - BeauSlush</title>
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-5027376166893400" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="lib/bootstrap/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="css/site.css">
</head>
<body>
<section class="gomoku-page" aria-labelledby="gomokuTitle">
    <header class="gomoku-heading">
        <div>
            <p class="gomoku-kicker">BEAUSLUSH / PLAY THE BOT</p>
            <h1 id="gomokuTitle">Gomoku</h1>
        </div>
        <button type="button" id="newGame" class="gomoku-reset">New game</button>
    </header>
    <div class="gomoku-layout">
        <aside class="gomoku-info">
            <div class="gomoku-difficulty" role="group" aria-label="Bot difficulty">
                <button type="button" id="easyMode" class="difficulty-button active" aria-pressed="true">Easy</button>
                <button type="button" id="hardMode" class="difficulty-button" aria-pressed="false">Hard</button>
            </div>
            <div class="gomoku-turn" id="turnCard" aria-live="polite">
                <span class="turn-stone black-stone" id="turnStone" aria-hidden="true"></span>
                <div><span class="turn-label">Turn</span><strong id="turnText">You (Black)</strong></div>
            </div>
            <p class="gomoku-message" id="gameMessage">You play first as Black. Get five in a row.</p>
            <div class="gomoku-players">
                <div class="player-row active" id="blackPlayer"><span class="player-disc black-stone"></span><span>You · Black</span><strong id="blackCount">0</strong></div>
                <div class="player-row" id="whitePlayer"><span class="player-disc white-stone"></span><span>Bot · White</span><strong id="whiteCount">0</strong></div>
            </div>
            <p class="gomoku-rule">Make five in a row horizontally, vertically, or diagonally before the bot does.</p>
        </aside>
        <div class="gomoku-board-frame">
            <div class="gomoku-board" id="gomokuBoard" role="grid" aria-label="Gomoku board, 15 by 15 intersections"></div>
        </div>
    </div>
</section>
<style>
    .gomoku-page { --gomoku-ink: #263b55; --gomoku-muted: #71829b; --gomoku-line: #dbe5f2; color: var(--gomoku-ink); padding: .35rem 0 1.25rem; }
    .gomoku-heading { display: flex; justify-content: space-between; align-items: center; gap: 1rem; margin-bottom: .85rem; }
    .gomoku-kicker { margin: 0 0 .2rem; color: #477be0; font-size: .66rem; font-weight: 800; letter-spacing: .12em; }
    .gomoku-heading h1 { margin: 0; font-size: 1.8rem; font-weight: 750; }
    .gomoku-reset { min-height: 40px; padding: .4rem .9rem; border: 1px solid #cfdbec; border-radius: 13px; background: #fff; color: #34527f; font: inherit; font-size: .8rem; font-weight: 700; cursor: pointer; }
    .gomoku-reset:hover { border-color: #8faee0; background: #f3f7ff; }
    .gomoku-layout { display: grid; grid-template-columns: minmax(190px, 245px) minmax(0, 1fr); gap: 1rem; align-items: start; }
    .gomoku-info { display: grid; gap: .85rem; padding: 1rem; border: 1px solid var(--gomoku-line); border-radius: 20px; background: #fff; box-shadow: 0 14px 34px rgba(49,83,137,.08); }
    .gomoku-difficulty { display: grid; grid-template-columns: 1fr 1fr; gap: .2rem; padding: .22rem; border: 1px solid var(--gomoku-line); border-radius: 13px; background: #f4f7fc; }
    .difficulty-button { min-height: 34px; border: 0; border-radius: 10px; background: transparent; color: #667995; font: inherit; font-size: .77rem; font-weight: 700; cursor: pointer; }
    .difficulty-button.active { background: #fff; color: #285db5; box-shadow: 0 1px 4px rgba(38,59,85,.12); }
    .gomoku-turn { display: flex; align-items: center; gap: .7rem; padding: .75rem; border: 1px solid #dbe5f2; border-radius: 15px; background: #f4f7fc; }
    .gomoku-turn > div { display: grid; gap: .08rem; }
    .turn-label { color: var(--gomoku-muted); font-size: .67rem; font-weight: 750; text-transform: uppercase; }
    .gomoku-turn strong { font-size: 1.15rem; }
    .turn-stone, .player-disc { display: inline-block; flex: 0 0 auto; width: 23px; height: 23px; border-radius: 50%; box-shadow: inset 1px 2px 3px rgba(255,255,255,.22), 0 2px 4px rgba(26,37,54,.2); }
    .black-stone { background: radial-gradient(circle at 32% 27%, #697386 0, #1a202b 42%, #05070b 100%); }
    .white-stone { background: radial-gradient(circle at 32% 27%, #fff 0, #f8fafc 45%, #cbd5e1 100%); border: 1px solid #b8c3d2; }
    .gomoku-message { min-height: 2.4em; margin: 0; color: #466183; font-size: .84rem; line-height: 1.5; }
    .gomoku-players { display: grid; gap: .4rem; }
    .player-row { display: grid; grid-template-columns: 18px 1fr auto; align-items: center; gap: .5rem; padding: .48rem .55rem; border: 1px solid transparent; border-radius: 12px; color: #546982; font-size: .8rem; }
    .player-row.active { border-color: #dbe5f2; background: #f4f7fc; color: var(--gomoku-ink); font-weight: 700; }
    .player-row .player-disc { width: 17px; height: 17px; }
    .player-row strong { color: var(--gomoku-muted); font-size: .72rem; font-variant-numeric: tabular-nums; }
    .gomoku-rule { margin: 0; padding-top: .65rem; border-top: 1px solid var(--gomoku-line); color: var(--gomoku-muted); font-size: .75rem; line-height: 1.55; }
    .gomoku-board-frame { width: min(100%, 690px); justify-self: center; padding: clamp(8px, 1.5vw, 16px); border: 1px solid #d9c28e; border-radius: 22px; background: linear-gradient(145deg, #f3dca9, #e8c886 50%, #dfbd7b); box-shadow: 0 15px 35px rgba(67,57,35,.16), inset 0 1px rgba(255,255,255,.7); }
    .gomoku-board { display: grid; grid-template-columns: repeat(15, minmax(0, 1fr)); width: 100%; aspect-ratio: 1; overflow: hidden; border: 1px solid rgba(118,86,40,.56); border-radius: 9px; background: #e8c987; touch-action: manipulation; }
    .gomoku-cell { position: relative; display: grid; place-items: center; min-width: 0; min-height: 0; padding: 0; border: 0; border-radius: 0; background-color: transparent; background-image: linear-gradient(to right, transparent calc(50% - .5px), rgba(104,75,36,.76) calc(50% - .5px), rgba(104,75,36,.76) calc(50% + .5px), transparent calc(50% + .5px)), linear-gradient(to bottom, transparent calc(50% - .5px), rgba(104,75,36,.76) calc(50% - .5px), rgba(104,75,36,.76) calc(50% + .5px), transparent calc(50% + .5px)); cursor: pointer; }
    .gomoku-cell:focus-visible { z-index: 2; outline: 2px solid #2266dd; outline-offset: -3px; }
    .gomoku-cell::after { content: ""; position: absolute; z-index: 1; width: 75%; height: 75%; border-radius: 50%; opacity: 0; transform: scale(.78); transition: transform .12s ease, opacity .12s ease; pointer-events: none; }
    .gomoku-cell[data-stone="black"]::after { opacity: 1; transform: scale(1); background: radial-gradient(circle at 32% 27%, #697386 0, #1a202b 42%, #05070b 100%); box-shadow: inset 1px 2px 3px rgba(255,255,255,.2), 0 2px 4px rgba(34,39,46,.35); }
    .gomoku-cell[data-stone="white"]::after { opacity: 1; transform: scale(1); background: radial-gradient(circle at 32% 27%, #fff 0, #f8fafc 45%, #cbd5e1 100%); border: 1px solid #aeb9c8; box-shadow: 0 2px 4px rgba(70,66,54,.2); }
    .gomoku-cell.last-move::before { content: ""; position: absolute; z-index: 2; width: 15%; height: 15%; border-radius: 50%; background: #e84e52; pointer-events: none; }
    .gomoku-cell.winning-move::after { outline: 3px solid #e84e52; outline-offset: 2px; }
    @media (max-width: 760px) { .gomoku-layout { grid-template-columns: minmax(0, 1fr); } .gomoku-info { grid-template-columns: minmax(0, 1fr) minmax(0, 1.2fr); align-items: center; gap: .55rem .75rem; padding: .7rem; } .gomoku-turn { padding: .5rem; } .gomoku-message { min-height: 0; } .gomoku-players { grid-column: 1; } .gomoku-rule { grid-column: 2; grid-row: 2; padding: 0 0 0 .65rem; border-top: 0; border-left: 1px solid var(--gomoku-line); } .gomoku-board-frame { width: min(100%, 620px); } }
    @media (max-width: 410px) { .gomoku-heading h1 { font-size: 1.5rem; } .gomoku-info { grid-template-columns: 1fr; } .gomoku-rule { grid-column: 1; grid-row: auto; padding: .5rem 0 0; border-left: 0; border-top: 1px solid var(--gomoku-line); } .gomoku-cell::after { width: 78%; height: 78%; } }
</style>
<script src="js/gomoku.js"></script>
<script src="lib/bootstrap/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/layout.js"></script>
</body>
</html>
