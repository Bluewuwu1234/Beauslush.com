<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>BeauSlush</title>
    <link rel="stylesheet" href="lib/bootstrap/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="css/site.css">
</head>
<body>

<div class="beabob-page">
    <section class="panel beabob-panel">
        <div class="panel-header">
            <h2>BeaBob</h2>
            <p class="text-muted">The best ai ever( said nobody ).</p>
        </div>

        <div class="chat-area">
            <div id="chatLog" class="chat-log"></div>
            <div class="chat-controls">
                <input id="userInput" type="text" placeholder="Ask something..." />
                <button id="sendBtn" class="hero-button">Send</button>
            </div>
        </div>
    </section>
</div>

    <script>
        const chatLog = document.getElementById('chatLog');
        const userInput = document.getElementById('userInput');
        const sendBtn = document.getElementById('sendBtn');

        function appendMessage(who, text) {
            const el = document.createElement('div');
            el.className = 'chat-message ' + who;
            el.textContent = (who === 'user' ? 'You: ' : 'BeaBob: ') + text;
            chatLog.appendChild(el);
            chatLog.scrollTop = chatLog.scrollHeight;
        }

        async function send() {
            const text = userInput.value.trim();
            if (!text) return;
            appendMessage('user', text);
            userInput.value = '';

            appendMessage('ai', getLocalAnswer(text));
        }

        function getLocalAnswer(input) {
            const text = input.toLowerCase();
            if (/^(hi|hello|hey|yo|greetings|howdy)\b/.test(text)) {
                return 'Hello! I am BeaBob. What would you like to explore?';
            }
            const facts = [
                ['beauslush', 'BeauSlush is a playful site full of tiny experiments, weird projects, and creative web toys.'],
                ['beabob', 'BeaBob is a cheerful little assistant for questions and ideas.'],
                ['slush slam', 'Slush Slam is a stacking game where you build a tower and keep it stable.'],
                ['teddys', 'Teddys is a playful gallery and studio for teddy-themed visuals.'],
                ['rng rng', 'RNG RNG is a luck-based mini-game where you roll random outcomes and collect rewards.'],
                ['credits', 'The Credits page thanks the people behind the project.']
            ];
            const fact = facts.find(([keyword]) => text.includes(keyword));
            if (fact) return fact[1];
            if (!text.trim()) return 'Please say something and I will do my best to help.';
            return 'The practical answer is to break the idea into small steps, test it, and improve it as you go.';
        }

        sendBtn.addEventListener('click', send);
        userInput.addEventListener('keydown', e => { if (e.key === 'Enter') send(); });

        
    </script>

    <script src="lib/bootstrap/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/layout.js"></script>
</body>
</html>
