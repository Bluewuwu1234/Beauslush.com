<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>BeauSlush</title>
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-5027376166839400" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="lib/bootstrap/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="css/site.css">
</head>
<body>

<div class="beabob-page">
    <section class="panel beabob-panel">
        <div class="panel-header">
            <h2>BeaBob</h2>
            <p class="text-muted">The best ai ever( said nobody ).</p>
        </div>

        <div class="chat-area">
            <div id="chatLog" class="chat-log"></div>
            <div class="chat-controls">
                <input id="userInput" type="text" placeholder="Ask something..." />
                <button id="sendBtn" class="hero-button">Send</button>
            </div>
        </div>
    </section>
</div>

    <script>
        const chatLog = document.getElementById('chatLog');
        const userInput = document.getElementById('userInput');
        const sendBtn = document.getElementById('sendBtn');
        let lastTopic = '';
        let responseIndex = 0;

        function appendMessage(who, text) {
            const el = document.createElement('div');
            el.className = 'chat-message ' + who;
            el.textContent = (who === 'user' ? 'You: ' : 'BeaBob: ') + text;
            chatLog.appendChild(el);
            chatLog.scrollTop = chatLog.scrollHeight;
        }

        async function send() {
            const text = userInput.value.trim();
            if (!text) return;
            appendMessage('user', text);
            userInput.value = '';

            appendMessage('ai', getLocalAnswer(text));
        }

        function getLocalAnswer(input) {
            const text = input.trim().toLowerCase().replace(/[^a-z0-9?.!\s]/g, ' ');
            if (!text) return 'Please say something and I will do my best to help.';

            if (/^(hi|hello|hey|yo|greetings|howdy)\b/.test(text)) {
                return 'Hello! I am BeaBob. Ask me about BeauSlush, the games, coding, or an idea you are working on.';
            }

            if (/what can you do|help me|commands|capable/.test(text)) {
                return 'I can explain the BeauSlush games, answer simple coding and project questions, suggest next steps, and help you think through an idea. Try asking “how does Slush Slam work?”';
            }

            const facts = [
                { words: ['beauslush', 'beauslush.com'], topic: 'beauslush', answer: 'BeauSlush is a playful site full of tiny experiments, weird projects, and creative web toys.' },
                { words: ['beabob'], topic: 'beabob', answer: 'BeaBob is a cheerful little assistant for questions and ideas. On GitHub Pages I run entirely in your browser, so no private API key is exposed.' },
                { words: ['slush slam', 'slushslam', 'stacking'], topic: 'slush slam', answer: 'Slush Slam is a stacking game. Drop each swinging block onto the tower, keep the tower balanced, and try to beat your best score and height.' },
                { words: ['teddys', 'teddy'], topic: 'teddys', answer: 'Teddys is a gallery and scene studio. Choose a teddy, click it to add it, or drag it onto the stage. You can then move, resize, and rotate it.' },
                { words: ['rng rng', 'rng', 'random'], topic: 'rng rng', answer: 'RNG RNG is a luck-based mini-game. Roll for an RNG, roll inside it for items, and use duplicate rewards to build up more slushles.' },
                { words: ['credits', 'creator'], topic: 'credits', answer: 'The Credits page thanks Beau, Juke, Jude, George Brown, Ainas, Ben, and C00lbanaynay.' },
                { words: ['github pages', 'static site'], topic: 'github pages', answer: 'GitHub Pages hosts the static HTML version of BeauSlush. That is why the games use browser JavaScript instead of server-side Razor or C#.' },
                { words: ['ads', 'adsense', 'advertising'], topic: 'adsense', answer: 'Google AdSense needs site verification and approval before ads appear. Never place private keys or database admin credentials in this static site.' }
            ];

            const fact = facts.find(item => item.words.some(word => text.includes(word)));
            if (fact) {
                lastTopic = fact.topic;
                return fact.answer;
            }

            const questionType = getQuestionType(text);
            const topic = extractTopic(text) || lastTopic;
            if (questionType === 'how') {
                return topic ? `A good way to approach ${topic} is to start with the smallest working version, test one part at a time, and improve it after you see what happens.` : 'Start by breaking the problem into small steps, test the first step, and adjust from there.';
            }
            if (questionType === 'why') {
                return topic ? `${capitalize(topic)} usually works that way because its behavior depends on the goal, the rules, and the choices around it.` : 'Usually there is more than one cause. Check the goal, the inputs, and what the program is actually doing.';
            }
            if (questionType === 'advice') {
                return 'My practical advice is to make the first version small, test it quickly, and change one thing at a time. That makes problems much easier to find.';
            }
            if (questionType === 'what') {
                return topic ? `${capitalize(topic)} is best understood by looking at what it does, why it exists, and how it connects to the rest of the project.` : 'The clearest answer depends on the topic. Add the thing you are asking about and I can give a more focused reply.';
            }

            const replies = [
                'That sounds like an interesting idea. What is the main result you want it to produce?',
                'I would break that into three parts: the goal, the inputs, and the behavior you expect. Then test the smallest part first.',
                'The simplest useful next step is to describe what currently happens and what you want to happen instead.',
                'That depends on the details, but a small experiment will usually reveal more than guessing. Try one change and check the result.'
            ];
            const reply = replies[responseIndex++ % replies.length];
            return reply;
        }

        function getQuestionType(text) {
            if (/^how\b/.test(text)) return 'how';
            if (/^why\b/.test(text)) return 'why';
            if (/^(can|could|should|do|would)\b/.test(text)) return 'advice';
            if (/^(what|who|where|when)\b/.test(text)) return 'what';
            return 'general';
        }

        function extractTopic(text) {
            const words = text.split(/\s+/).filter(word => word.length > 3 && !['what', 'does', 'this', 'that', 'with', 'about', 'have', 'from'].includes(word));
            return words.slice(0, 2).join(' ');
        }

        function capitalize(text) {
            return text ? text.charAt(0).toUpperCase() + text.slice(1) : text;
        }

        sendBtn.addEventListener('click', send);
        userInput.addEventListener('keydown', e => { if (e.key === 'Enter') send(); });

        
    </script>

    <script src="lib/bootstrap/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/layout.js"></script>
</body>
</html>
