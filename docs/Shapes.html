<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Shapes - BeauSlush</title>
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-5027376166893400" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="lib/bootstrap/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="css/site.css">
</head>
<body>
<section class="shapes-page" aria-labelledby="shapesTitle">
    <header class="shapes-heading">
        <h1 id="shapesTitle">Shapes</h1>
        <p id="shapeStatus" aria-live="polite"></p>
    </header>
    <div class="shapes-toolbar">
        <div class="shape-palette" aria-label="Shape palette">
            <button type="button" class="shape-choice" data-shape="square" draggable="false">Square</button>
            <button type="button" class="shape-choice" data-shape="circle" draggable="false">Circle</button>
            <button type="button" class="shape-choice" data-shape="triangle" draggable="false">Triangle</button>
            <button type="button" class="shape-choice" data-shape="star" draggable="false">Star</button>
            <button type="button" class="shape-choice" data-shape="pentagon" draggable="false">Pentagon</button>
            <button type="button" class="shape-choice" data-shape="hexagon" draggable="false">Hexagon</button>
        </div>
        <fieldset id="shapeInspector" class="shape-inspector" disabled>
            <label class="shape-color" for="shapeColor">Color <input id="shapeColor" type="color" value="#477be0"></label>
            <label class="shape-range" for="shapeScale">Scale <output id="scaleValue">1.00x</output><input id="shapeScale" type="range" min="0.55" max="1.8" step="0.05" value="1"></label>
            <label class="shape-range" for="shapeRotation">Rotate <output id="rotationValue">0°</output><input id="shapeRotation" type="range" min="-180" max="180" step="1" value="0"></label>
            <button type="button" class="shape-clear-selected" id="deleteShape" aria-label="Delete selected shape" title="Delete selected shape">Delete</button>
        </fieldset>
        <button type="button" class="shape-clear-all" id="clearShapes">Clear all</button>
    </div>
    <div class="shapes-stage-wrap">
        <svg id="shapesCanvas" class="shapes-canvas" viewBox="0 0 800 450" role="img" aria-label="Physics canvas where shapes fall and stack">
            <rect id="canvasPaper" class="canvas-paper" x="0" y="0" width="800" height="450" />
            <g id="shapeLayer"></g>
        </svg>
        <div class="canvas-caption">Physics simulation involving shapes</div>
    </div>
</section>
<style>
    body:has(.shapes-page) { margin-bottom: 0; overflow: hidden; }
    body:has(.shapes-page) footer { display: none; }
    .shapes-page { --shape-ink: #263b55; --shape-muted: #71829b; --shape-line: #dbe5f2; height: calc(100dvh - 150px); min-height: 0; display: flex; flex-direction: column; gap: .65rem; overflow: hidden; padding: .15rem 0 .5rem; color: var(--shape-ink); }
    .shapes-heading { display: flex; justify-content: space-between; align-items: center; gap: .75rem; flex: 0 0 auto; }
    .shapes-heading h1 { margin: 0; font-size: 1.55rem; font-weight: 750; }
    .shapes-heading p { margin: 0; color: var(--shape-muted); font-size: .8rem; }
    .shapes-toolbar { display: flex; align-items: center; flex-wrap: wrap; gap: .5rem; flex: 0 0 auto; padding: .55rem; border: 1px solid var(--shape-line); border-radius: 18px; background: rgba(255,255,255,.86); box-shadow: 0 8px 24px rgba(49,83,137,.08); }
    .shape-palette { display: flex; flex-wrap: wrap; gap: .35rem; }
    .shape-choice, .shape-clear-selected, .shape-clear-all { min-height: 36px; padding: .35rem .7rem; border: 1px solid #d9e4f3; border-radius: 12px; background: #f3f7ff; color: #34527f; font: inherit; font-size: .76rem; font-weight: 700; cursor: grab; touch-action: none; user-select: none; }
    .shape-choice:hover { border-color: #8faee0; background: #e8f0ff; }
    .shape-choice:active { cursor: grabbing; }
    .shape-inspector { display: flex; align-items: center; gap: .6rem; min-width: 0; margin: 0; padding: 0 .15rem; border: 0; }
    .shape-inspector:disabled { opacity: .5; }
    .shape-inspector label { display: flex; align-items: center; gap: .35rem; margin: 0; color: #476080; font-size: .72rem; font-weight: 700; white-space: nowrap; }
    .shape-inspector output { min-width: 2.7rem; color: var(--shape-muted); text-align: right; font-variant-numeric: tabular-nums; font-weight: 500; }
    .shape-inspector input[type="range"] { width: 78px; accent-color: #477be0; }
    .shape-color input { width: 32px; height: 30px; padding: 2px; border: 1px solid #d9e4f3; border-radius: 9px; background: white; cursor: pointer; }
    .shape-clear-selected { min-height: 32px; border-color: #f0d5d5; background: #fff3f2; color: #a84646; }
    .shape-clear-all { margin-left: auto; cursor: pointer; }
    .shapes-stage-wrap { position: relative; display: flex; flex: 1 1 auto; min-height: 120px; flex-direction: column; overflow: hidden; border: 1px solid #d5e1f0; border-radius: 20px; background: #eaf1fc; box-shadow: 0 12px 30px rgba(48,76,120,.11); }
    .shapes-canvas { display: block; flex: 1 1 auto; width: 100%; min-height: 0; touch-action: none; }
    .canvas-paper { fill: #f8faff; }
    .shape-item { cursor: grab; }
    .shape-item:active { cursor: grabbing; }
    .shape-item > :first-child { stroke: rgba(35,61,101,.25); stroke-width: 2; vector-effect: non-scaling-stroke; }
    .shape-item .selection-outline { fill: none; stroke: #263b55; stroke-width: 2; stroke-dasharray: 5 4; vector-effect: non-scaling-stroke; pointer-events: none; }
    .canvas-caption { display: flex; justify-content: space-between; flex: 0 0 auto; padding: .4rem .7rem; border-top: 1px solid #d5e1f0; background: rgba(255,255,255,.8); color: var(--shape-muted); font-size: .64rem; font-weight: 750; }
    @media (max-width: 700px) {
        .shapes-page { height: calc(100dvh - 145px); gap: .45rem; }
        .shapes-heading h1 { font-size: 1.35rem; }
        .shapes-heading p { font-size: .72rem; }
        .shapes-toolbar { align-items: stretch; gap: .4rem; padding: .45rem; border-radius: 15px; }
        .shape-palette { display: grid; flex: 1 1 100%; grid-template-columns: repeat(6, minmax(0,1fr)); gap: .25rem; }
        .shape-choice { min-width: 0; min-height: 34px; padding: .25rem .15rem; font-size: .65rem; }
        .shape-inspector { flex: 1 1 auto; justify-content: space-between; gap: .3rem; }
        .shape-inspector input[type="range"] { width: 52px; }
        .shape-inspector label { gap: .2rem; font-size: .65rem; }
        .shape-inspector output { min-width: 2.2rem; }
        .shape-clear-all { min-height: 32px; padding: .25rem .5rem; }
        .shapes-stage-wrap { border-radius: 16px; }
    }
    @media (max-height: 650px) { .shapes-page { height: calc(100dvh - 125px); gap: .35rem; } .shapes-toolbar { padding: .35rem; } .shapes-stage-wrap { min-height: 90px; } }
</style>
<script src="https://cdn.jsdelivr.net/npm/matter-js@0.20.0/build/matter.min.js"></script>
<script src="js/shapes.js"></script>
<script src="lib/bootstrap/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/layout.js"></script>
</body>
</html>
