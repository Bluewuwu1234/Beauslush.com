<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>BeauSlush</title>
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-5027376166839400" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="lib/bootstrap/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="css/site.css">
</head>
<body>

<div class="slush-slam-page">
    <section class="slush-slam-shell">
        <div id="game-container" class="game-container" aria-label="Slush Slam game area">
            <div id="hud">
                <div>
                    <div id="score-display">0<span class="unit"> pts</span></div>
                    <div id="height-sub">0 blocks high</div>
                </div>
                <div id="right-hud">
                    <div id="best-display">BEST: 0</div>
                    <div id="combo-display">COMBO x1</div>
                </div>
            </div>

            <div id="wobble-label">Stability</div>
            <div id="wobble-bar-container"><div id="wobble-bar"></div></div>
            <div id="tap-hint">TAP OR CLICK TO DROP</div>
            <div id="flash"></div>
            <div id="collapse-banner">
                <div class="title">TOWER FELL</div>
                <div class="points"></div>
                <div class="best-tag hidden">★ NEW BEST ★</div>
            </div>
        </div>
    </section>
</div>

<style>
    .slush-slam-page {
        padding: 1.5rem 0 2rem;
    }

    .slush-slam-shell {
        background: rgba(255, 255, 255, 0.9);
        border: 1px solid rgba(117, 147, 214, 0.25);
        border-radius: 30px;
        box-shadow: 0 20px 50px rgba(31, 60, 118, 0.12);
        padding: 1rem 0.9rem 0.9rem;
        backdrop-filter: blur(12px);
    }

    .game-container {
        position: relative;
        width: 100%;
        height: min(74vh, 760px);
        min-height: 540px;
        border-radius: 24px;
        overflow: hidden;
        background: linear-gradient(180deg, #f2f7ff 0%, #e3edff 42%, #dfeeff 100%);
        border: 1px solid rgba(85, 114, 170, 0.12);
    }

    .game-container canvas {
        display: block;
        width: 100%;
        height: 100%;
        touch-action: none;
    }

    #hud {
        position: absolute;
        inset: 0 0 auto 0;
        display: flex;
        justify-content: space-between;
        padding: max(16px, env(safe-area-inset-top)) max(18px, env(safe-area-inset-right)) 0 max(18px, env(safe-area-inset-left));
        pointer-events: none;
        z-index: 10;
    }

    #score-display {
        font-size: clamp(2rem, 4vw, 2.5rem);
        font-weight: 800;
        color: #16315d;
        text-shadow: 0 2px 8px rgba(255,255,255,0.38);
        letter-spacing: 1px;
        line-height: 1;
    }

    #score-display .unit {
        font-size: 12px;
        font-weight: 500;
        opacity: 0.82;
        letter-spacing: 1px;
        text-transform: uppercase;
    }

    #height-sub {
        font-size: 13px;
        color: rgba(22, 49, 93, 0.78);
        margin-top: 4px;
        font-weight: 700;
    }

    #right-hud {
        text-align: right;
    }

    #best-display {
        font-size: 13px;
        color: #c98a22;
        text-shadow: 0 2px 6px rgba(255,255,255,0.28);
        font-weight: 800;
    }

    #combo-display {
        font-size: 12px;
        color: #1f7a67;
        font-weight: 800;
        margin-top: 6px;
        opacity: 0;
        transition: opacity 0.15s ease;
    }

    #combo-display.show {
        opacity: 1;
    }

    #wobble-bar-container {
        position: absolute;
        top: calc(96px + env(safe-area-inset-top));
        left: max(18px, env(safe-area-inset-left));
        width: 130px;
        height: 8px;
        background: rgba(255,255,255,0.15);
        border-radius: 4px;
        overflow: hidden;
        z-index: 10;
    }

    #wobble-bar {
        height: 100%;
        width: 0%;
        background: linear-gradient(90deg, #4aa88a, #ebc76a, #d86a6a);
        transition: width 0.15s ease-out;
        border-radius: 4px;
    }

    #wobble-label {
        position: absolute;
        top: calc(108px + env(safe-area-inset-top));
        left: max(18px, env(safe-area-inset-left));
        font-size: 10px;
        color: rgba(22, 49, 93, 0.7);
        letter-spacing: 1px;
        text-transform: uppercase;
        z-index: 10;
    }

    #tap-hint {
        position: absolute;
        bottom: max(40px, calc(24px + env(safe-area-inset-bottom)));
        left: 0;
        right: 0;
        text-align: center;
        color: rgba(26, 41, 75, 0.58);
        font-size: 13px;
        letter-spacing: 1px;
        z-index: 5;
        pointer-events: none;
        animation: slushPulse 2s infinite ease-in-out;
    }

    @keyframes slushPulse {
        0%, 100% { opacity: 0.35; }
        50% { opacity: 0.8; }
    }

    #flash {
        position: absolute;
        inset: 0;
        background: rgba(255, 255, 255, 0.92);
        opacity: 0;
        pointer-events: none;
        z-index: 15;
    }

    #collapse-banner {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -40%) scale(0.85);
        text-align: center;
        z-index: 16;
        pointer-events: none;
        opacity: 0;
        transition: opacity 0.25s ease, transform 0.25s ease;
    }

    #collapse-banner.show {
        opacity: 1;
        transform: translate(-50%, -50%) scale(1);
    }

    #collapse-banner .title {
        font-size: clamp(1.75rem, 4vw, 2.3rem);
        font-weight: 900;
        color: #d85b5b;
        text-shadow: 0 4px 18px rgba(208, 92, 92, 0.18);
        letter-spacing: 1px;
    }

    #collapse-banner .points {
        font-size: 16px;
        font-weight: 700;
        color: #16315d;
        margin-top: 6px;
        text-shadow: 0 2px 10px rgba(255,255,255,0.32);
    }

    #collapse-banner .best-tag {
        font-size: 12px;
        font-weight: 800;
        color: #1f7a67;
        margin-top: 8px;
        letter-spacing: 1px;
        text-shadow: 0 2px 10px rgba(255,255,255,0.2);
    }

    .hidden {
        display: none !important;
    }

    .popup {
        position: absolute;
        font-weight: 800;
        font-size: 16px;
        pointer-events: none;
        z-index: 12;
        text-shadow: 0 2px 6px rgba(0,0,0,0.6);
        animation: popupFloat 0.7s ease-out forwards;
    }

    @keyframes popupFloat {
        0% { opacity: 0; transform: translate(-50%, 0) scale(0.7); }
        15% { opacity: 1; transform: translate(-50%, -6px) scale(1.1); }
        100% { opacity: 0; transform: translate(-50%, -46px) scale(1); }
    }

    @media (max-width: 640px) {
        .slush-slam-shell {
            padding: 1rem 0.75rem 0.75rem;
        }

        .slush-slam-topbar {
            justify-content: center;
        }

        .game-container {
            height: min(68vh, 640px);
            min-height: min(480px, 78vh);
        }

        .slush-slam-page {
            padding: 0.75rem 0 1rem;
        }

        #score-display {
            font-size: 1.8rem;
        }
    }
</style>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
    <script>
        const { Engine, Runner, World, Bodies, Events, Composite } = Matter;

        const container = document.getElementById('game-container');
        let W = window.innerWidth;
        let H = window.innerHeight;

        const engine = Engine.create();
        const BASE_GRAVITY = 1.05;
        engine.gravity.y = BASE_GRAVITY;
        const world = engine.world;

        const canvas = document.createElement('canvas');
        container.insertBefore(canvas, document.getElementById('hud'));
        const ctx = canvas.getContext('2d');

        function resize() {
            W = container.clientWidth;
            H = container.clientHeight;
            canvas.width = W;
            canvas.height = H;
        }
        resize();
        window.addEventListener('resize', resize);

        let running = false;
        let score = 0;
        let combo = 1;
        let best = parseInt(localStorage.getItem('slushSlamBest') || '0');
        document.getElementById('best-display').textContent = 'BEST: ' + best;

        let blocks = [];
        let currentBlock = null;
        let swingAngle = 0;
        let swingCenterX = 0;
        let swingDir = 1;
        let swingRadius = 160;
        let swingSpeed = 0.03;
        let swingPivotY = 90;
        let baseY = 0;
        let cameraY = 0;
        let targetCameraY = 0;
        let gameOver = false;
        let shakeMagnitude = 0;
        let particles = [];
        let colorHue = 200;
        let dropCooldown = false;
        let restartTimer = null;

        const BLOCK_W = 90;
        const BLOCK_H = 34;

        let ground;

        function currentSwingSpeedBase() {
            const n = blocks.length;
            return 0.034 + Math.min(0.09, n * 0.0027);
        }

        function currentGravity() {
            const n = blocks.length;
            return BASE_GRAVITY + Math.min(1.05, n * 0.022);
        }

        function resetWorld() {
            Composite.clear(world, false);
            blocks = [];
            particles = [];
            score = 0;
            combo = 1;
            gameOver = false;
            cameraY = 0;
            targetCameraY = 0;
            shakeMagnitude = 0;
            colorHue = Math.random() * 360;
            engine.gravity.y = BASE_GRAVITY;

            baseY = H - 120;

            ground = Bodies.rectangle(W / 2, baseY + 40, W * 2, 80, {
                isStatic: true,
                friction: 1,
                render: { fillStyle: '#181c30' }
            });
            World.add(world, ground);

            updateHUD();
            spawnSwingingBlock();
        }

        function spawnSwingingBlock() {
            colorHue = (colorHue + 25 + Math.random() * 20) % 360;

            swingDir = Math.random() < 0.5 ? 1 : -1;
            swingRadius = 110 + Math.random() * 90;
            swingCenterX = W / 2 + (Math.random() - 0.5) * 60;
            swingPivotY = 80 + Math.random() * 40;
            swingAngle = Math.random() * Math.PI * 2;
            swingSpeed = currentSwingSpeedBase() * (0.85 + Math.random() * 0.4);

            currentBlock = {
                w: BLOCK_W - 8 - Math.random() * 18,
                h: BLOCK_H,
                hue: colorHue
            };
            dropCooldown = false;
        }

        function getSwingPos() {
            const x = swingCenterX + Math.sin(swingAngle) * swingRadius;
            return { x, y: swingPivotY };
        }

        function towerTopY() {
            if (blocks.length === 0) return baseY;
            let minY = baseY;
            for (const b of blocks) {
                const top = b.position.y - BLOCK_H / 2;
                if (top < minY) minY = top;
            }
            return minY;
        }

        function towerCenterX() {
            if (blocks.length === 0) return W / 2;
            const recent = blocks.slice(-3);
            let sum = 0;
            for (const b of recent) sum += b.position.x;
            return sum / recent.length;
        }

        function dropBlock() {
            if (!running || gameOver || dropCooldown || !currentBlock) return;
            dropCooldown = true;

            const pos = getSwingPos();
            const w = currentBlock.w;
            const h = currentBlock.h;
            const hue = currentBlock.hue;

            const body = Bodies.rectangle(pos.x, pos.y, w, h, {
                friction: 0.78,
                frictionStatic: 1.2,
                restitution: 0.02,
                density: 0.002,
                render: { fillStyle: `hsl(${hue},75%,60%)` }
            });
            body.customHue = hue;
            body.customW = w;
            body.customH = h;
            World.add(world, body);

            const targetX = towerCenterX();
            const offset = Math.abs(pos.x - targetX);
            const accuracy = Math.max(0, 1 - offset / (w * 1.1));
            const base = 10;
            const accuracyBonus = Math.round(accuracy * 20);

            if (accuracy > 0.6) {
                combo += 1;
            } else if (accuracy < 0.25) {
                combo = 1;
            }
            const comboMult = Math.min(5, combo);
            const gained = (base + accuracyBonus) * comboMult;
            score += gained;

            showPopup(pos.x, pos.y - cameraY, gained, accuracy);
            updateComboDisplay();

            blocks.push(body);
            currentBlock = null;

            engine.gravity.y = currentGravity();

            const nextDelay = Math.max(230, 520 - blocks.length * 4);
            setTimeout(() => {
                if (!gameOver && running) spawnSwingingBlock();
            }, nextDelay);
        }

        function showPopup(x, y, points, accuracy) {
            const el = document.createElement('div');
            el.className = 'popup';
            el.style.left = x + 'px';
            el.style.top = (y - 20) + 'px';
            let color = '#ffd166';
            let label = '+' + points;
            if (accuracy > 0.85) { color = '#95d5b2'; label = '+' + points + ' PERFECT'; }
            else if (accuracy < 0.25) { color = '#ff8a8a'; }
            el.style.color = color;
            el.textContent = label;
            container.appendChild(el);
            setTimeout(() => el.remove(), 720);
        }

        function updateComboDisplay() {
            const el = document.getElementById('combo-display');
            if (combo > 1) {
                el.textContent = 'COMBO x' + Math.min(5, combo);
                el.classList.add('show');
            } else {
                el.classList.remove('show');
            }
        }

        function checkCollapse() {
            if (blocks.length < 2) return;
            for (const b of blocks) {
                if (b.position.y > baseY + 400) {
                    triggerGameOver();
                    return;
                }
            }
            let unstable = 0;
            for (const b of blocks) {
                const angle = Math.abs(((b.angle % (Math.PI * 2)) + Math.PI * 2) % (Math.PI * 2));
                const normalized = Math.min(angle, Math.PI * 2 - angle);
                if (normalized > 0.75) unstable++;
            }
            if (unstable > 0 && blocks.length > 2) {
                triggerGameOver();
            }
        }

        function computeWobble() {
            if (blocks.length === 0) return 0;
            let maxTilt = 0;
            for (const b of blocks) {
                const angle = Math.abs(((b.angle % (Math.PI * 2)) + Math.PI * 2) % (Math.PI * 2));
                const normalized = Math.min(angle, Math.PI * 2 - angle);
                if (normalized > maxTilt) maxTilt = normalized;
            }
            return Math.min(1, maxTilt / 0.75);
        }

        function triggerGameOver() {
            if (gameOver) return;
            gameOver = true;
            running = false;
            currentBlock = null;
            shakeMagnitude = 25;
            flash();

            let isNewBest = false;
            if (score > best) {
                best = score;
                localStorage.setItem('slushSlamBest', best);
                isNewBest = true;
            }
            updateHUD();
            showCollapseBanner(isNewBest);

            clearTimeout(restartTimer);
            restartTimer = setTimeout(() => {
                hideCollapseBanner();
                resetWorld();
                running = true;
            }, 1150);
        }

        function showCollapseBanner(isNewBest) {
            const banner = document.getElementById('collapse-banner');
            banner.querySelector('.points').textContent = score + ' pts · ' + blocks.length + ' blocks';
            banner.querySelector('.best-tag').classList.toggle('hidden', !isNewBest);
            banner.classList.add('show');
        }

        function hideCollapseBanner() {
            document.getElementById('collapse-banner').classList.remove('show');
        }

        function flash() {
            const el = document.getElementById('flash');
            el.style.transition = 'none';
            el.style.opacity = '0.5';
            requestAnimationFrame(() => {
                el.style.transition = 'opacity 0.4s ease-out';
                el.style.opacity = '0';
            });
        }

        function spawnParticles(x, y, color, count) {
            for (let i = 0; i < count; i++) {
                particles.push({
                    x, y,
                    vx: (Math.random() - 0.5) * 8,
                    vy: (Math.random() - 1.5) * 8,
                    life: 1,
                    color
                });
            }
        }

        function updateHUD() {
            document.getElementById('score-display').innerHTML = score + '<span class="unit"> pts</span>';
            document.getElementById('height-sub').textContent = blocks.length + ' blocks high';
            document.getElementById('best-display').textContent = 'BEST: ' + best;
            const wobble = computeWobble();
            document.getElementById('wobble-bar').style.width = (wobble * 100) + '%';
        }

        let lastMilestone = 0;
        function checkMilestone() {
            const milestones = [10, 20, 35, 50, 75, 100, 150];
            for (const m of milestones) {
                if (blocks.length === m && lastMilestone !== m) {
                    lastMilestone = m;
                    spawnParticles(W / 2, towerTopY() - cameraY, '255,209,102', 30);
                    shakeMagnitude = Math.max(shakeMagnitude, 6);
                }
            }
        }

        function handleInput(e) {
            if (e) e.preventDefault();
            if (!running || gameOver) return;
            dropBlock();
        }

        canvas.addEventListener('pointerdown', handleInput, { passive: false });
        canvas.addEventListener('touchstart', (e) => { e.preventDefault(); }, { passive: false });
        window.addEventListener('keydown', (e) => {
            if (e.code === 'Space') handleInput(e);
        });

        document.addEventListener('gesturestart', (e) => e.preventDefault());
        document.addEventListener('contextmenu', (e) => e.preventDefault());
        let lastTouchEnd = 0;
        document.addEventListener('touchend', (e) => {
            const now = Date.now();
            if (now - lastTouchEnd <= 300) e.preventDefault();
            lastTouchEnd = now;
        }, { passive: false });

        Events.on(engine, 'afterUpdate', () => {
            if (!running || gameOver) return;
            if (currentBlock) {
                swingAngle += swingSpeed * swingDir;
            }
            checkCollapse();
        });

        function updateCamera() {
            const top = towerTopY();
            const safeTop = Math.max(112, H * 0.24);
            targetCameraY = Math.max(0, (baseY - top) - (H - safeTop));
            cameraY += (targetCameraY - cameraY) * 0.14;
        }

        function render() {
            updateCamera();
            if (running && !gameOver) {
                updateHUD();
                checkMilestone();
            }

            ctx.clearRect(0, 0, W, H);

            let shakeX = 0, shakeY = 0;
            if (shakeMagnitude > 0.1) {
                shakeX = (Math.random() - 0.5) * shakeMagnitude;
                shakeY = (Math.random() - 0.5) * shakeMagnitude;
                shakeMagnitude *= 0.88;
            } else {
                shakeMagnitude = 0;
            }

            ctx.save();
            ctx.translate(shakeX, cameraY + shakeY);

            ctx.fillStyle = '#ffffff';
            ctx.fillRect(0, baseY + 40 - 40, W, 200);
            ctx.fillStyle = 'rgba(31, 92, 191, 0.10)';
            for (let i = 0; i < W; i += 40) {
                ctx.fillRect(i, baseY + 42, 20, 4);
            }

            for (const b of blocks) {
                ctx.save();
                ctx.translate(b.position.x, b.position.y);
                ctx.rotate(b.angle);
                const hue = b.customHue;
                const grad = ctx.createLinearGradient(-b.customW / 2, -b.customH / 2, b.customW / 2, b.customH / 2);
                grad.addColorStop(0, `hsl(${hue},75%,65%)`);
                grad.addColorStop(1, `hsl(${hue},70%,48%)`);
                ctx.fillStyle = grad;
                ctx.strokeStyle = `hsl(${hue},60%,30%)`;
                ctx.lineWidth = 2;
                roundRect(ctx, -b.customW / 2, -b.customH / 2, b.customW, b.customH, 6);
                ctx.fill();
                ctx.stroke();
                ctx.restore();
            }

            if (currentBlock && running && !gameOver) {
                const pos = getSwingPos();
                const hue = currentBlock.hue;

                ctx.strokeStyle = 'rgba(255,255,255,0.25)';
                ctx.lineWidth = 2;
                ctx.setLineDash([4, 6]);
                ctx.beginPath();
                ctx.moveTo(swingCenterX, swingPivotY - 20);
                ctx.lineTo(pos.x, pos.y);
                ctx.stroke();
                ctx.setLineDash([]);

                const targetX = towerCenterX();
                ctx.strokeStyle = 'rgba(255,255,255,0.2)';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(targetX, swingPivotY);
                ctx.lineTo(targetX, baseY + 100);
                ctx.stroke();

                ctx.strokeStyle = `hsla(${hue}, 80%, 70%, 0.3)`;
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(pos.x, pos.y);
                ctx.lineTo(pos.x, baseY + 100);
                ctx.stroke();

                ctx.save();
                ctx.translate(pos.x, pos.y);
                const grad = ctx.createLinearGradient(-currentBlock.w / 2, -currentBlock.h / 2, currentBlock.w / 2, currentBlock.h / 2);
                grad.addColorStop(0, `hsl(${hue},80%,68%)`);
                grad.addColorStop(1, `hsl(${hue},75%,52%)`);
                ctx.fillStyle = grad;
                ctx.strokeStyle = `hsl(${hue},60%,35%)`;
                ctx.lineWidth = 2;
                roundRect(ctx, -currentBlock.w / 2, -currentBlock.h / 2, currentBlock.w, currentBlock.h, 6);
                ctx.fill();
                ctx.stroke();
                ctx.restore();
            }

            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.vy += 0.3;
                p.life -= 0.02;
                if (p.life <= 0) { particles.splice(i, 1); continue; }
                ctx.fillStyle = `rgba(${p.color},${p.life})`;
                ctx.beginPath();
                ctx.arc(p.x, p.y, 4, 0, Math.PI * 2);
                ctx.fill();
            }

            ctx.restore();
            requestAnimationFrame(render);
        }

        function roundRect(ctx, x, y, w, h, r) {
            ctx.beginPath();
            ctx.moveTo(x + r, y);
            ctx.arcTo(x + w, y, x + w, y + h, r);
            ctx.arcTo(x + w, y + h, x, y + h, r);
            ctx.arcTo(x, y + h, x, y, r);
            ctx.arcTo(x, y, x + w, y, r);
            ctx.closePath();
        }

        const runner = Runner.create();
        Runner.run(runner, engine);
        resetWorld();
        running = true;
        lastMilestone = 0;
        requestAnimationFrame(render);
    </script>

    <script src="lib/bootstrap/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/layout.js"></script>
</body>
</html>
